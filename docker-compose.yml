services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-walletbet}
      POSTGRES_USER: ${POSTGRES_USER:-wallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-walletbet};Username=${POSTGRES_USER:-wallet};Password=${POSTGRES_PASSWORD:-wallet-local-only}"
      Jwt__Key: ${JWT_KEY:-local-development-jwt-key-not-for-production-32chars}
      Jwt__Issuer: wallet-bet-api
      Jwt__Audience: wallet-bet-clients
      Webhook__Secret: ${WEBHOOK_SECRET:-local-development-webhook-secret-not-for-production}
      Admin__Email: ${ADMIN_EMAIL:-admin@example.com}
      Admin__Password: ${ADMIN_PASSWORD:-ChangeMe123!}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
