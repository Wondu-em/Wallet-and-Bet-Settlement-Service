version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: wallet-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet_dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  wallet-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallet-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=postgres;Username=wallet;Password=wallet_dev_password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
